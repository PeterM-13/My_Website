<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Every project Peter Metcalfe has built, from age 15 to now." />

    <title>Peter's Projects</title>
    <link rel="icon" type="image/png" href="images/P logo clear.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="main.css">
</head>

<body>

    <nav class="nav">
        <div class="nav-inner">
            <a class="logo" href="../">← Peter Metcalfe<span class="grad-text">.</span></a>
            <div class="nav-right">
                <a href="https://www.instagram.com/peter_metcalfe_/" target="_blank">Instagram</a>
                <a href="https://www.thingiverse.com/peter-metcalfe/designs" target="_blank">Thingiverse</a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <h1>All <span class="grad-text">Projects</span></h1>
        <p>Everything I've built from age 15 to now.<br>
            Click a photo to view the full gallery.</p>
    </header>

    <div class="filter-bar">
        <div class="filter-inner">
            <div id="filterChips" class="chips"></div>
            <span id="filterCount" class="filter-count"></span>
        </div>
    </div>

    <main id="years"></main>

    <footer>
        <button id="topButton" class="btn">Back to Top ↑</button>
        <a href="../" class="btn">Back to Home</a>
    </footer>

    <div id="lightbox" class="lightbox">
        <button id="lbClose" class="lb-btn lb-close" aria-label="Close">✕</button>
        <button id="lbPrev" class="lb-btn lb-prev" aria-label="Previous">‹</button>
        <img id="lbImg" src="" alt="Project photo">
        <button id="lbNext" class="lb-btn lb-next" aria-label="Next">›</button>
        <p id="lbCaption"></p>
    </div>

    <script src="main.js"></script>
</body>

</html>
